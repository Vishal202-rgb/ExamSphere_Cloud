# ==============================================================================
# ExamSphere – Automated Continuous Integration & Delivery Pipeline (CI/CD)
# Tests, validates Prisma, lints, builds bundles, and verifies Docker containers
# ==============================================================================

name: ExamSphere CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Lint, Prisma Validation, and Automated Unit/Integration Tests
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Tests & Database Schema Validation
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
      JWT_SECRET: "ci_pipeline_test_jwt_secret_key_2026_at_least_32_chars"
      REFRESH_TOKEN_SECRET: "ci_pipeline_test_refresh_jwt_secret_key_2026"
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Prisma Relational Schema
        working-directory: ./server
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Generate Prisma Client Engine
        working-directory: ./server
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
        run: npx prisma generate

      - name: Run Backend Automated Test Suite
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
          JWT_SECRET: "ci_pipeline_test_jwt_secret_key_2026_at_least_32_chars"
          REFRESH_TOKEN_SECRET: "ci_pipeline_test_refresh_jwt_secret_key_2026"
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Lint, Type Check, and Production Bundle Build
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Lint & Production Bundle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci --include=optional

      - name: Lint Frontend Source Code
        working-directory: ./client
        run: npm run lint

      - name: Build Vite Production Assets (Code-Splitting Verification)
        working-directory: ./client
        env:
          VITE_API_BASE_URL: "/api/v1"
          VITE_SOCKET_URL: "/"
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Image Verification & Container Build
  # ----------------------------------------------------------------------------
  docker-build:
    name: Build & Verify Production Docker Images
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: examsphere-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: examsphere-client:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 4: Secure Production Deployment (Gated on Authorization & Secrets)
  # ----------------------------------------------------------------------------
  deploy:
    name: Authorized AWS EC2 / Container Deployment
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && false # Gated: Disabled until user explicitly configures live AWS secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Docker Compose to Remote Host via SSH
        env:
          HOST: ${{ secrets.PROD_HOST }}
          USER: ${{ secrets.PROD_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          echo "Automated deployment step triggers remote docker compose pull and restart when secrets are configured."
