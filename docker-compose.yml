version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: examsphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-examsphere_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - examsphere_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-examsphere_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: examsphere_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - examsphere_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: examsphere_server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-examsphere_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      JWT_SECRET: ${JWT_SECRET:-examsphere_super_secret_jwt_key_2026}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-examsphere_super_secret_jwt_key_2026}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-examsphere_super_secret_refresh_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-examsphere_super_secret_refresh_key_2026}
    ports:
      - "5000:5000"
    networks:
      - examsphere_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: examsphere_client
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - examsphere_network
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  examsphere_network:
    driver: bridge
